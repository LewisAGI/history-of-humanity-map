name: Pages

on:
  push:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy-preview:
    needs: test
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "Refusing to deploy production from the preview job."
            exit 1
          fi
          if ! npx wrangler pages project list | grep -F "history-of-humanity-map"; then
            npx wrangler pages project create history-of-humanity-map --production-branch main
          fi
          npx wrangler pages deploy dist \
            --project-name=history-of-humanity-map \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}"

  deploy-production:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Refusing to deploy production from ${GITHUB_REF}."
            exit 1
          fi
          if ! npx wrangler pages project list | grep -F "history-of-humanity-map"; then
            npx wrangler pages project create history-of-humanity-map --production-branch main
          fi
          npx wrangler pages deploy dist \
            --project-name=history-of-humanity-map \
            --branch=main \
            --commit-hash="${GITHUB_SHA}"
